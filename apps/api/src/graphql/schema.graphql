# ── Metric Trend ─────────────────────────────────────────
type MetricTrend {
  value: Float!
  direction: String!
}

# ── Dashboard Metrics ───────────────────────────────────
type DashboardMetrics {
  totalRevenue: Float!
  occupancyRate: Float!
  activeBookings: Int!
  pendingPayments: Float!
  totalSeats: Int!
  availableSeats: Int!
  revenueTrend: MetricTrend!
  occupancyTrend: MetricTrend!
  bookingsTrend: MetricTrend!
}

# ═══════════════════════════════════════════════════════════
# CRM — ONBOARDING PIPELINE
# (Full field definitions live in the entity files; this section
#  documents the shapes added by the onboarding work so the schema
#  reference is no longer stale.)
# ═══════════════════════════════════════════════════════════

enum OnboardingStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
}

type Onboarding {
  id: ID!
  leadId: ID
  customerId: ID
  status: OnboardingStatus!
  companyName: String
  companyAddress: String
  gstNumber: String
  planType: String
  seatCount: Int
  contactName: String
  contactEmail: String
  contactPhone: String
  emergencyContact: String
  emergencyPhone: String
  idProofUrl: String
  agreementUrl: String
  completedAt: DateTime
  notes: String
  assignedToId: ID
  centerId: ID
  lead: Lead
  customer: Customer
  assignedTo: User
  center: Center
  createdAt: DateTime!
  updatedAt: DateTime!
}

type ConvertLeadResult {
  lead: Lead!
  customer: Customer!
  onboarding: Onboarding!
}

input OnboardingFiltersInput {
  status: OnboardingStatus
  centerId: ID
  assignedToId: ID
  search: String
  limit: Int
  offset: Int
}

input CreateOnboardingInput {
  leadId: ID
  customerId: ID
  status: OnboardingStatus
  companyName: String
  companyAddress: String
  gstNumber: String
  planType: String
  seatCount: Int
  contactName: String
  contactEmail: String
  contactPhone: String
  emergencyContact: String
  emergencyPhone: String
  idProofUrl: String
  agreementUrl: String
  notes: String
  assignedToId: ID
  centerId: ID
}

input UpdateOnboardingInput {
  status: OnboardingStatus
  companyName: String
  companyAddress: String
  gstNumber: String
  planType: String
  seatCount: Int
  contactName: String
  contactEmail: String
  contactPhone: String
  emergencyContact: String
  emergencyPhone: String
  idProofUrl: String
  agreementUrl: String
  notes: String
  assignedToId: ID
  centerId: ID
}

# Note: Customer now also exposes userId (linked login account) plus the
# onboarding-extension columns (gstNumber, companyAddress, planType,
# communicationChannel, etc.) and Lead exposes customerId (the back-reference
# to the Customer created on conversion). See entity files for full lists.
