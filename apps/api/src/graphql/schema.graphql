# NOTE: This is a REFERENCE document. The live schema is generated by
# NestJS/GraphQL from @ObjectType, @Resolver, @Query, @Mutation decorators.
# To see the actual schema, run the API and visit /graphql in development.

# ── Scalars ──────────────────────────────────────────────
scalar DateTime
scalar JSON

# ═══════════════════════════════════════════════════════════
# QUERIES
# ═══════════════════════════════════════════════════════════
type Query {
  # Auth & User
  me: User!
  users(limit: Int, offset: Int): [User!]!
  user(id: ID!): User
  myActiveSessions: [UserSession!]!

  # Centers & Locations
  centers: [Center!]!
  center(id: ID!): Center
  centerSettings(centerId: ID): String!
  myCenters: [Center!]!
  locations: [Location!]!
  location(id: ID!): Location

  # Floors & Seats
  floors(centerId: ID): [Floor!]!
  seats(floorId: ID): [Seat!]!
  seat(id: ID!): Seat

  # Bookings
  bookings(filters: BookingFilters): [Booking!]!
  myBookings: [Booking!]!
  booking(id: ID!): Booking

  # CRM — Leads
  leads(filters: LeadFiltersInput): [Lead!]!
  lead(id: ID!): Lead
  leadCount(status: LeadStatus): Int!

  # CRM — Customers
  customers(filters: CustomerFiltersInput): [Customer!]!
  customer(id: ID!): Customer
  customerCount(status: CustomerStatus): Int!
  customerDeposits(customerId: ID!): [Deposit!]!
  customerContracts(customerId: ID!): [Contract!]!
  customerInvoices(customerId: ID!): [Invoice!]!

  # CRM — Onboarding (lead → customer pipeline tracking)
  onboardings(filters: OnboardingFiltersInput): [Onboarding!]!
  onboarding(id: ID!): Onboarding
  onboardingCount(status: OnboardingStatus): Int!

  # Revenue — Invoices
  invoices(filters: InvoiceFiltersInput): [Invoice!]!
  invoice(id: ID!): Invoice
  invoiceCount(status: InvoiceStatus): Int!

  # Revenue — Deposits
  deposits(filters: DepositFiltersInput): [Deposit!]!
  deposit(id: ID!): Deposit

  # Revenue — Contracts
  contracts(filters: ContractFiltersInput): [Contract!]!
  contract(id: ID!): Contract

  # Events
  events(filters: EventFiltersInput): [Event!]!
  event(id: ID!): Event
  todayEvents(centerId: String): [Event!]!
  upcomingEvents(centerId: String): [Event!]!
  pastEvents(centerId: String): [Event!]!
  eventStatistics(centerId: String): EventStatistics!
  eventsByDateRange(startDate: String!, endDate: String!, centerId: String): [Event!]!
  availableRoomsForEvent(centerId: String!, eventDate: String!, startTime: String!, endTime: String!, floorId: String): [MeetingRoom!]!
  myEvents(requestedBy: String, centerId: String, status: EventStatus): [Event!]!

  # Meeting Rooms
  meetingRooms(filters: RoomFiltersInput): [MeetingRoom!]!
  meetingRoom(id: ID!): MeetingRoom
  availableRooms(centerId: String, capacity: Int): [MeetingRoom!]!
  roomAvailability(centerId: String!, floorId: String!, eventDate: String!, startTime: String!, endTime: String!): [MeetingRoom!]!

  # Requests
  requests(filters: RequestFiltersInput): [Request!]!
  request(id: ID!): Request
  requestStats(centerId: String): RequestStatistics!
  myRequests(requestedBy: String!, status: RequestStatus): [Request!]!
  pendingRequests(centerId: String, urgency: String): [Request!]!
  requestsByType(type: RequestType!, centerId: String): [Request!]!
  highPriorityRequests(centerId: String): [Request!]!
  overdueRequests(centerId: String): [Request!]!
  requestsByCenter(centerId: String!, limit: Int): [Request!]!

  # Analytics
  dashboardMetrics(centerId: ID): DashboardMetrics!
  revenueReport(centerId: ID, period: TimePeriod): RevenueReport!
  occupancyReport(centerId: ID, period: TimePeriod): OccupancyReport!

  # Discounts
  discounts(filters: DiscountFiltersInput): [Discount!]!
  discount(id: ID!): Discount

  # Audit Log
  auditLogs(filters: AuditLogFiltersInput): [AuditLog!]!
  auditLogStatistics(filters: AuditLogFiltersInput): AuditLogStatistics!

  # Notifications
  notifications(filters: NotificationFiltersInput): [Notification!]!
  notification(id: ID!): Notification
  notificationStats(userId: ID, centerId: ID): NotificationStatistics!
  myNotifications: [Notification!]!
}

# ═══════════════════════════════════════════════════════════
# MUTATIONS
# ═══════════════════════════════════════════════════════════
type Mutation {
  # Authentication
  signin(input: SigninInput!): AuthPayload!
  signup(input: SignupInput!): AuthPayload!
  verifyTwoFactor(input: VerifyTwoFactorInput!): AuthPayload!
  logout: Boolean!
  requestPasswordReset(input: ForgotPasswordInput!): Boolean!
  resetPassword(input: ResetPasswordInput!): Boolean!
  changePassword(input: ChangePasswordInput!): Boolean!
  requestMagicLink(input: ForgotPasswordInput!): Boolean!
  verifyMagicLink(input: VerifyMagicLinkInput!): AuthPayload!
  verifyEmail(token: String!): GenericActionResult!
  refreshTokens(refreshToken: String!): AuthPayload!
  beginTwoFactorSetup: String!
  confirmTwoFactorSetup(input: EnableTwoFactorInput!): [String!]!
  disableTwoFactor(code: String!): Boolean!
  resendVerification: Boolean!
  recoveryCodesRemaining: Int!
  regenerateRecoveryCodes: [String!]!

  # Centers
  createCenter(input: CreateCenterInput!): Center!
  updateCenter(id: ID!, input: UpdateCenterInput!): Center!
  deleteCenter(id: ID!): Boolean!

  # Locations
  createLocation(input: CreateLocationInput!): Location!
  updateLocation(id: ID!, input: UpdateLocationInput!): Location!

  # Floors & Seats
  createFloor(input: CreateFloorInput!): Floor!
  createSeat(input: CreateSeatInput!): Seat!
  updateSeat(id: ID!, input: UpdateSeatInput!): Seat!

  # Bookings
  createBooking(input: CreateBookingInput!): Booking!
  updateBooking(id: ID!, input: UpdateBookingInput!): Booking!
  cancelBooking(id: ID!): Booking!
  checkInBooking(id: ID!): Booking!
  checkOutBooking(id: ID!): Booking!
  processPayment(paymentId: ID!, method: String!): Payment!

  # CRM — Leads
  createLead(input: CreateLeadInput!): Lead!
  updateLead(id: ID!, input: UpdateLeadInput!): Lead!
  convertLead(id: ID!): Lead!   # Legacy: flips status + creates a bare Customer (no onboarding)
  convertLeadWithOnboarding(
    id: ID!
    companyName: String
    companyAddress: String
    gstNumber: String
    companyType: String
    industry: String
    website: String
    employeeCount: Int
    planType: String
    seatCount: Int
    contactName: String
    contactEmail: String
    contactPhone: String
    alternateEmail: String
    alternatePhone: String
    dob: String
    emergencyContact: String
    emergencyPhone: String
    communicationChannel: String
    idProofUrl: String
    agreementUrl: String
    notes: String
    provisionLogin: Boolean
  ): ConvertLeadResult!   # Atomic: Customer + Onboarding + (optional) login User
  deleteLead(id: ID!): Boolean!

  # CRM — Customers
  createCustomer(input: CreateCustomerInput!): Customer!   # Also seeds an Onboarding + login User
  updateCustomer(id: ID!, input: UpdateCustomerInput!): Customer!
  deleteCustomer(id: ID!): Boolean!

  # CRM — Onboarding lifecycle
  createOnboarding(input: CreateOnboardingInput!): Onboarding!
  updateOnboarding(id: ID!, input: UpdateOnboardingInput!): Onboarding!
  advanceOnboardingStatus(id: ID!): Onboarding!
  completeOnboarding(id: ID!): Onboarding!
  deleteOnboarding(id: ID!): Boolean!

  # Revenue — Invoices
  createInvoice(input: CreateInvoiceInput!): Invoice!
  updateInvoice(id: ID!, input: UpdateInvoiceInput!): Invoice!
  deleteInvoice(id: ID!): Boolean!
  markInvoicePaid(id: ID!, paymentMethod: String): Invoice!

  # Revenue — Deposits
  createDeposit(input: CreateDepositInput!): Deposit!
  updateDeposit(id: ID!, input: UpdateDepositInput!): Deposit!
  releaseDeposit(id: ID!): Deposit!
  freezeDeposit(id: ID!): Deposit!
  unfreezeDeposit(id: ID!): Deposit!
  requestDepositRelease(id: ID!): Deposit!
  approveDepositRelease(id: ID!): Deposit!
  sendDepositReminder(id: ID!, reminderType: String!): Boolean!
  exportDeposits(format: String): String!
  deleteDeposit(id: ID!): Boolean!

  # Revenue — Contracts
  createContract(input: CreateContractInput!): Contract!
  updateContract(id: ID!, input: UpdateContractInput!): Contract!
  terminateContract(id: ID!): Contract!
  renewContract(id: ID!, newEndDate: Date!): Contract!

  # Events
  createEvent(input: CreateEventInput!): CreateEventPayload!
  updateEvent(id: ID!, input: UpdateEventInput!): CreateEventPayload!
  updateEventStatus(id: ID!, status: EventStatus!): CreateEventPayload!
  cancelEvent(id: ID!): Boolean!
  deleteEvent(id: ID!): Boolean!

  # Meeting Rooms
  createMeetingRoom(input: CreateMeetingRoomInput!): MeetingRoom!
  updateMeetingRoom(id: ID!, input: UpdateMeetingRoomInput!): MeetingRoom!
  updateRoomStatus(id: ID!, status: String!): MeetingRoom!
  deleteMeetingRoom(id: ID!): Boolean!
  bulkUpdateStatus(roomIds: [String!]!, status: String!): Boolean!
  bookRoom(roomId: String!, centerId: String!, eventDate: String!, startTime: String!, endTime: String!, title: String!, requestedBy: String): MeetingRoom!
  cancelRoomBooking(bookingId: String!, roomId: String!): Boolean!

  # Requests
  createRequest(input: CreateRequestInput!): Request!
  updateRequest(id: ID!, input: UpdateRequestInput!): Request!
  assignRequest(id: ID!, assignedToId: String!): Request!
  approveRequest(id: ID!): Request!
  rejectRequest(id: ID!, resolution: String!): Request!
  completeRequest(id: ID!, resolution: String): Request!
  cancelRequest(id: ID!): Boolean!
  escalateRequest(id: ID!): Request!
  deleteRequest(id: ID!): Boolean!

  # Discounts
  createDiscount(input: CreateDiscountInput!): Discount!
  updateDiscount(id: ID!, input: UpdateDiscountInput!): Discount!
  deleteDiscount(id: ID!): Boolean!

  # Notifications
  createNotification(input: CreateNotificationInput!): Notification!
  sendNotification(input: SendNotificationInput!): Int!
  markNotificationRead(id: ID!, read: Boolean): Notification!
  markAllNotificationsRead(userId: ID, centerId: ID): Int!
  deleteNotification(id: ID!): Boolean!

  # Admin
  deleteUser(id: ID!): Boolean!
  setUserRole(id: ID!, role: UserRole!): Boolean!
  setUserActive(id: ID!, isActive: Boolean!): Boolean!
  updateProfile(name: String): User!
  logoutDevice(id: ID!): Boolean!
  logoutAllDevices: Int!
}

# ═══════════════════════════════════════════════════════════
# SUBSCRIPTIONS
# ═══════════════════════════════════════════════════════════
type Subscription {
  bookingUpdated: Booking!
  paymentStatusChanged: Payment!
  seatUpdated(centerId: ID): Seat!
  centerUpdated(centerId: ID): Center!
}

